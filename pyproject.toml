[tool.poetry]
name = "homework_10_1"
version = "0.1.0"
description = ""
authors = ["Alex <ddubokk@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"
requests = "^2.34.2"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.4.1"
mypy = "^1.14.0"
black = "^26.10.1"
isort = "^6.0.0"
pytest = "^9.1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'

[tool.black]
line-length = 119
exclude = '''
(
  /(
      \.eggs         # Исключить несколько общих каталогов
    | \.git          # в корне проекта
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
  | foo.py           # Также отдельно исключить файл с именем foo.py в корне проекта
)
'''

[tool.isort]
line_length = 119
profile = "black"


[tool.pytest.ini_options]
pythonpath = ["src"]